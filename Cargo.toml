[package]
name = "waveshare_net"
version = "0.1.0"
edition = "2024"

[dependencies]
esp-hal = { version = "1.1.1", features = ["esp32c6", "unstable"] }
esp-radio = { version = "0.18.0", features = ["esp32c6", "wifi"] }

embassy-executor = "0.10.0"
embassy-net = { version = "0.9.1", features = ["proto-ipv4", "dhcpv4", "medium-ethernet"] }
embassy-time = "0.5.1"

static_cell = "2.1.1"
